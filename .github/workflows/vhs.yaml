name: VHS Visual Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Build binary
        run: task build

      - name: Start WireMock
        run: task vhs:mock:start

      - name: Install VHS
        uses: charmbracelet/vhs-action@v2

      - name: Generate VHS recordings
        run: task vhs
        env:
          FASTMAIL_ENDPOINT: http://localhost:8080
          FASTMAIL_ACCESS_TOKEN: test-token

      - name: Stop WireMock
        if: always()
        run: task vhs:mock:stop

      - name: Compare golden files
        run: task vhs:check

      - name: Upload GIFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vhs-recordings
          path: docs/vhs/*.gif
          retention-days: 14
