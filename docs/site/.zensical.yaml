# Zensical Documentation Site Configuration
# https://zensical.org/

site_name: FastMail CLI
site_url: https://fastmail-cli.pages.dev
site_description: A CLI, MCP server, and Go library for FastMail via JMAP, CardDAV, and CalDAV
site_author: FastMail CLI Contributors

docs_dir: .
site_dir: _site

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference:
      - Overview: cli/index.md
      - auth: cli/auth.md
      - mail: cli/mail.md
      - mailbox: cli/mailbox.md
      - contacts: cli/contacts.md
      - calendar: cli/calendar.md
      - masked-email: cli/masked-email.md
      - vacation: cli/vacation.md
      - identity: cli/identity.md
      - filter: cli/filter.md
      - export: cli/export.md
      - account: cli/account.md
  - MCP Integration:
      - Overview: mcp/index.md
      - Setup Guide: mcp/setup.md
      - Tools Reference: mcp/tools.md
      - Resources Reference: mcp/resources.md
  - Go Library:
      - Overview: api/index.md
      - Client: api/fastmail.md
      - Mail: api/mail.md
      - Contacts: api/contacts.md
      - Calendar: api/calendar.md
      - Masked Email: api/masked-email.md

theme:
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: lucide/moon
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
