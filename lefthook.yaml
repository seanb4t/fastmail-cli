# Lefthook git hooks manager
# Install: task hooks:install
# Uninstall: task hooks:uninstall
# Override locally: create lefthook.local.yaml (gitignored)

no_auto_install: true

pre-commit:
  parallel: true
  exclude:
    - ".worktrees/**"
  commands:
    lint-go:
      glob: "*.go"
      run: golangci-lint run --new-from-rev=HEAD~1
      stage_fixed: true
    format-imports:
      glob: "*.go"
      run: goimports -w -local github.com/seanb4t/fastmail-cli {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional-commit:
      run: cog verify --file {1}

pre-push:
  commands:
    test:
      run: go test -race ./...
