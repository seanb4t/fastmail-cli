version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # Default linters (enabled by default, listed for clarity)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional recommended linters
    - bodyclose
    - dupl
    - errorlint
    - exhaustive
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - misspell
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - octalLiteral
        - rangeValCopy
        - hugeParam
        - commentedOutCode
        - unnamedResult
        - paramTypeCombine
        - emptyStringTest
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
  exclusions:
    rules:
      # Allow repeated strings and complexity in tests
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - gocognit
          - gocyclo
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/seanb4t/fastmail-cli

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
