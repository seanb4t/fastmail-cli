version: '3'

vars:
  BINARY_NAME: fastmail-cli
  BUILD_DIR: ./bin
  MAIN_PKG: ./cmd/fastmail-cli

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the binary
    cmds:
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.MAIN_PKG}}
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BUILD_DIR}}/{{.BINARY_NAME}}'

  test:
    desc: Run all tests
    cmds:
      - go test -race -cover ./...

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  test:bdd:
    desc: Run BDD integration tests
    cmds:
      - go test -tags integration -race -v ./test/integration/

  test:all:
    desc: Run all tests (unit + BDD)
    cmds:
      - task: test
      - task: test:bdd

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Run linters and fix issues
    cmds:
      - golangci-lint run --fix ./...

  generate:
    desc: Run go generate
    cmds:
      - go generate ./...

  mocks:
    desc: Generate mocks with mockery
    cmds:
      - mockery

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f coverage.out coverage.html

  all:
    desc: Run lint, test, and build
    cmds:
      - task: lint
      - task: test
      - task: build

  # Integration tests
  test:integration:
    desc: Run teatest integration tests
    cmds:
      - go test -race -run 'TestIntegration|TestBDD_Integration' ./internal/tui/ -v

  test:golden:update:
    desc: Regenerate golden files for integration tests
    cmds:
      - go test -run 'TestIntegration|TestBDD_Integration' ./internal/tui/ -v -update

  # VHS screen recordings
  vhs:mock:start:
    desc: Start WireMock Docker container for VHS
    cmds:
      - docker run -d --name fm-mock -p 8080:8080 -v $(pwd)/docs/vhs/wiremock:/home/wiremock wiremock/wiremock:latest

  vhs:mock:stop:
    desc: Stop WireMock Docker container
    cmds:
      - docker rm -f fm-mock 2>/dev/null || true

  vhs:
    desc: Generate all VHS recordings
    deps: [build]
    cmds:
      - vhs docs/vhs/dashboard.tape
      - vhs docs/vhs/compose.tape
      - vhs docs/vhs/navigation.tape

  vhs:check:
    desc: Diff VHS golden files against expected baselines
    cmds:
      - diff docs/vhs/testdata/dashboard.ascii docs/vhs/expected/dashboard.ascii
      - diff docs/vhs/testdata/compose.ascii docs/vhs/expected/compose.ascii
      - diff docs/vhs/testdata/navigation.ascii docs/vhs/expected/navigation.ascii

  vhs:update:
    desc: Copy VHS testdata to expected baselines
    cmds:
      - mkdir -p docs/vhs/expected
      - cp docs/vhs/testdata/*.ascii docs/vhs/expected/

  # Git hooks
  hooks:install:
    desc: Install git hooks via lefthook
    cmds:
      - lefthook install

  hooks:uninstall:
    desc: Uninstall git hooks via lefthook
    cmds:
      - lefthook uninstall

  # Documentation tasks
  docs:build:
    desc: Build documentation site
    dir: docs/site
    cmds:
      - zensical build
    sources:
      - '**/*.md'
      - '.zensical.yaml'
    generates:
      - '_site/**/*'

  docs:serve:
    desc: Serve documentation locally
    dir: docs/site
    cmds:
      - zensical serve

  release:check:
    desc: Validate GoReleaser config
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build a local snapshot release (no publish)
    cmds:
      - goreleaser release --snapshot --clean

  docs:clean:
    desc: Clean documentation build artifacts
    cmds:
      - rm -rf docs/site/_site
